name: CI
on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run test:hitl
      - name: Metabocommand MCP
        run: |
          npm --prefix packages/metabocommand-mcp install --no-audit --no-fund
          npm --prefix packages/metabocommand-mcp test
